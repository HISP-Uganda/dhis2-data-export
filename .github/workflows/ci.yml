name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
        env:
          CI: true

      - name: Code health (fallow)
        run: npx --yes fallow@3.42.0 --fail-on-issues

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: build/bundle/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Check whether this version is already released
        id: check
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: bundle
          path: bundle

      - name: Create GitHub Release
        if: steps.check.outputs.release == 'true'
        run: |
          gh release create "$TAG" bundle/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
